<div *ngIf="entrada" class="ferhel">
  <div *ngIf="descubierto" class="cuerpo">
    <img [src]="`assets/img/ferhel/${ferhel}/${ferhel}_lista.png`" [class.nuevoImagen]="nuevo">
    <div class="nombre" [class.nuevoTexto]="nuevo">{{ entrada.nombre }}</div>
  </div>
  <div *ngIf="!descubierto" class="cuerpo">
    <img [src]="`assets/img/ferhel/${ferhel}/${ferhel}_silueta.png`">
    <div class="nombre">¿?</div>
  </div>
</div>
