<div class="fondo" (click)="siguiente()">
  <img *ngIf="entrada" class="foto" [src]="entrada.foto">
  <div *ngIf="entrada" class="nombre">{{ entrada.nombre }}</div>
  <div *ngIf="entrada" class="caja">
    <img class="fondo-dialogo" src="assets/img/cuadro_dialogo.png">
    <p class="texto" [innerHTML]="textoMostrado"></p>
    <div class="flecha" *ngIf="paginaActual < paginas.length - 1"></div>
  </div>
</div>
