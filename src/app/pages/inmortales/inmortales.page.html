<ion-content [fullscreen]="true">
  <img
    class="fondo" 
    src="assets/fondos/fondo_inmortales.jpg"
  >

  <video
    #video
    *ngIf="mostrarVideo"
    [src]="'assets/videos/video_inmortales.mp4'"
    autoplay
    preload="auto"
    playsinline
    muted
    poster="assets/fondos/negro.jpg"
    (timeupdate)="onTimeUpdate()"
    (click)="saltarVideo()"
    (ended)="onVideoEnded()"
    [class.animar]="animacion"
    style="
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    object-fit: cover;
    transform-origin: center center;
    ">
  </video>

  <div class="flash" [class.mostrarFlash]="animacion"></div>

  <div class="categoria bishna" (click)="irA('bishna')" [class.desaparecer]="mostrarVideo">
    <div class="texto"><span>Bishna</span></div>
    <img src="assets/iconos/bishnas.png" class="icono bishnas">
  </div>

  <div class="categoria celestial" [class.desaparecer]="mostrarVideo">
    <img src="assets/iconos/celestiales.png" class="icono celestiales">
    <div class="texto"><span>Celestial</span></div>
  </div>

  <div class="categoria vishundi" [class.desaparecer]="mostrarVideo">
    <img src="assets/iconos/vishundis.png" class="icono vishundis">
    <div class="texto"><span>Vishundi</span></div>
  </div>

</ion-content>

<div class="opciones aparecer">
  <app-atras [pagina]="'archivo'"></app-atras>
  <app-musica></app-musica>
  <app-ayuda [pagina]="'inmortales'"></app-ayuda>
</div>
