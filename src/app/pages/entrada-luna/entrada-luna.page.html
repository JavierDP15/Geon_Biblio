<ion-content [fullscreen]="true" [scrollY]="false">
  <img 
    class="imagen-fondo"
    src="assets/fondos/fondo_lunas.webp"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; z-index: 0; pointer-events: none;"
  />

  <div *ngIf="entrada" class="cuerpo">
    <img
      class="imagen"
      [src]="'assets/img/lunas/' + luna + '.webp'"
      [alt]="entrada.nombre"  
    >
    <div 
      class="caja-texto">
    </div>
    <div class="texto no-scrollbar">{{ entrada.descripcion }}</div>
  </div>
</ion-content>

<div class="opciones aparecer">
    <app-atras [pagina]="'lunas'"></app-atras>
    <app-musica></app-musica>
    <app-ayuda [pagina]="luna"></app-ayuda>
    <app-salir></app-salir>
</div>
