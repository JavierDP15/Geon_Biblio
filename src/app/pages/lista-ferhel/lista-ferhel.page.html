<ion-content [fullscreen]="true" [scrollY]="false">
  <img 
    class="imagen-fondo"
    src="assets/fondos/fondo_ferhel.jpg"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; z-index: 0; pointer-events: none;"
  />

  <div *ngIf="lista.length" class="lista">
    <app-ferhel-component 
      *ngFor="let ferhel of paginaActualItems" 
      [ferhel]="ferhel.id">
    </app-ferhel-component>
  </div>

  <div class="paginacion">
    <div *ngIf="paginaActual > 1" class="atras" (click)="anterior()"><span>◀</span></div>
    <div *ngIf="paginaActual < paginasTotales" class="siguiente" (click)="siguiente()"><span>▶</span></div>
  </div>
</ion-content>

<div class="opciones aparecer">
  <app-atras [pagina]="'ferhel'"></app-atras>
  <app-musica></app-musica>
  <app-ayuda [pagina]="'lista-ferhel'"></app-ayuda>
</div>
