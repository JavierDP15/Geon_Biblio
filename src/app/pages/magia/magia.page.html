<ion-content [fullscreen]="true">
  <div class="circle-container">
    <svg width="170" height="170" viewBox="0 0 170 170">
      <circle class="draw-circle" cx="60" cy="60" r="50" fill="none" stroke="blue" stroke-width="2" />
    </svg>
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle class="draw-circle" cx="50%" cy="50%" r="60" fill="none" stroke="red" stroke-width="2" />
    </svg>
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle class="draw-circle" cx="60" cy="60" r="40" fill="none" stroke="yellow" stroke-width="2" />
    </svg>
  </div>
</ion-content>

<div class="opciones">
  <app-atras [pagina]="'archivo'"></app-atras>
  <app-musica></app-musica>
  <app-ayuda [pagina]="'magia'"></app-ayuda>
</div>
