<ion-content [fullscreen]="true" [scrollY]="false">
  <img 
    class="imagen-fondo"
    src="assets/fondos/fondo_territorios.webp"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; z-index: 0; pointer-events: none;"
  />

  <div class="cuerpo">
    <div class="territorio samadha" (click)="irA('samadha')">
      <div *ngIf="territorioObjetivo === 'samadha'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/samadha.webp"/>
      <div class="texto">Samadha</div>
    </div>
    <div class="territorio ankit" (click)="irA('samadha')">
      <div *ngIf="territorioObjetivo === 'ankit'" class="ankit"></div>
      <img class="foto" src="assets/img/territorios/ankit.webp"/>
      <div class="texto">Ankit</div>
    </div>
    <div class="territorio radaeron" (click)="irA('radaeron')">
      <div *ngIf="territorioObjetivo === 'radaeron'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/radaeron.webp"/>
      <div class="texto">Radaeron</div>
    </div>
    <div class="territorio saprashibaya" (click)="irA('saprashibaya')">
      <div *ngIf="territorioObjetivo === 'saprashibaya'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/saprashibaya.webp"/>
      <div class="texto">Saprashibaya</div>
    </div>
    <div class="territorio tel-abadir" (click)="irA('tel-abadir')">
      <div *ngIf="territorioObjetivo === 'tel-abadir'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/tel_abadir.webp"/>
      <div class="texto">Tel Abadir</div>
    </div>
    <div class="territorio daicon" (click)="irA('daicon')">
      <div *ngIf="territorioObjetivo === 'daicon'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/daicon.webp"/>
      <div class="texto">Daicon</div>
    </div>
    <div class="horizontes" (click)="irA('horizontes')">
      <div *ngIf="territorioObjetivo === 'horizontes'" class="circulo"></div>
      <img class="foto" src="assets/img/territorios/otros_horizontes.webp"/>
      <div class="texto">Otros horizontes</div>
    </div>
  </div>
</ion-content>

<div class="opciones aparecer">
  <app-atras [pagina]="'geografia'"></app-atras>
  <app-musica></app-musica>
  <app-ayuda [pagina]="'territorios'"></app-ayuda>
  <app-salir></app-salir>
</div>
