<ion-content [fullscreen]="true">
  <img 
    class="imagen-fondo"
    src="assets/fondos/fondo_categoria.jpg"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;"
  />

  <div class="cuerpo">
    <div *ngIf="mostrarCuerpo" class="opciones">
    <div class="atras">
      <app-atras [pagina]="'archivo'"></app-atras>
    </div>
    <div class="sonido">
      <app-musica></app-musica>
    </div>
    <div class="ayuda">
      <app-ayuda [pagina]="'geones'"></app-ayuda>
    </div>
  </div>
  </div>
</ion-content>
