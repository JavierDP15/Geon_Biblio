<ion-content [fullscreen]="true" [scrollY]="false">

  <img 
    class="imagen-fondo"
    src="assets/fondos/fondo_geones.jpg"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: top;"
    />

  <div *ngIf="mostrarCuerpo" class="cuerpo aparecer" [class.expandido]="!botonesVisibles">
    <div class="geones">Geones</div>
    <div class="texto" [class.aparecerTexto]="!botonesVisibles" [class.ocultarTexto]="botonesVisibles">{{ geones?.descripcion }}</div>
    <div class="botones" [class.mostrar]="botonesVisibles" [class.ocultar]="!botonesVisibles">
      <div class="boton" (click)="irA('constelaciones')"><span>Panteón</span></div>
      <div class="boton"><span>Calamidades</span></div>
      <div class="boton"><span>Apotheosis</span></div>
      <div class="boton"><span class="manifestaciones">Otras<br>Manifestaciones</span></div>
    </div>
    <div class="cuerpoMenu">
      <img class="toggle" src="assets/img/boton_menu.png" [class.flechaArriba]="botonesVisibles" [class.flechaAbajo]="!botonesVisibles" (click)="toggleBotones()"/>
      <span class="menu" [class.menuArriba]="botonesVisibles" [class.menuAbajo]="!botonesVisibles">Menú</span>
    </div>
  </div>
  <div *ngIf="mostrarCuerpo" class="opciones aparecer">
      <app-atras [pagina]="'archivo'"></app-atras>
      <app-musica></app-musica>
      <app-ayuda [pagina]="'geones'"></app-ayuda>
  </div>
</ion-content>
