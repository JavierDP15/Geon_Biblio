<ion-content [fullscreen]="true" [scrollY]="false">
  <img 
    class="imagen-fondo"
    src="assets/fondos/geografia/fondo_geografia.webp"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; z-index: 0; pointer-events: none;"
  />

  <div class="cuerpo">
    <div *ngIf="entrada" class="titulo">{{ entrada.otrosDatos.subtitulo }}</div>
    <div *ngIf="lista.length" class="lugares">
      <app-lugar *ngFor="let lugar of lista" [lugar]="lugar.id">
      </app-lugar>
    </div>
  </div>
</ion-content>

<div class="opciones aparecer">
  <app-atras [pagina]="'geografia/' + territorio"></app-atras>
  <app-musica></app-musica>
  <app-ayuda [pagina]="'territorio'"></app-ayuda>
  <app-salir></app-salir>
</div>
