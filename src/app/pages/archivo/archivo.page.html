<ion-content [fullscreen]="true" [scrollY]="false">
  <video
    #video
    [src]="'assets/videos/entrada_archivo.mp4'"
    muted
    playsinline
    preload="auto"
    poster="assets/fondos/negro.jpg"
    (click)="saltarVideo()"
    (ended)="onVideoEnded()"
    [class.active]="currentStep === 1"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
  </video>

  <img 
    src="assets/fondos/fondo_archivo.png"
    [class.active]="currentStep === 2"
    [class.blur-background]="tutorial"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;"
  />

  <div *ngIf="mostrarCuerpo" class="cuerpo" [class.blur-background]="tutorial">
    <button class="archivo">Archivo</button>
    <div class="botones">
      <div class="fila-botones">
        <div class="boton">
          <img class="icono-boton" src="assets/iconos/geografia.png">
          <button class="boton">Geografía</button>
        </div>
        <div></div>
        <div class="boton">
          <img class="icono-boton" src="assets/iconos/geones.png">
          <button class="boton">Geones</button>
        </div>
      </div>
      <div class="fila-botones">
        <div class="boton">
          <img class="icono-boton" src="assets/iconos/geografia.png">
          <button class="boton">Magia</button>
        </div>
        <div></div>
        <div class="boton">
          <img class="icono-boton" src="assets/iconos/geografia.png">
          <button class="boton">Ferhel</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="mostrarCuerpo" class="opciones" >
    <div class="ayuda">
      <img src="assets/iconos/ayuda.png">
    </div>
    <div class="sonido">
      <app-musica></app-musica>
    </div>
    <div class="ayuda" [class.blur-background]="tutorial">
      <app-ayuda [pagina]="'archivo'"></app-ayuda>
    </div>
  </div>

  <div *ngIf="tutorial" class="tutorial">
    <app-dialogo [pagina]="'archivo'" [tutorial]="tutorial" (cerrar)="tutorial = null"></app-dialogo>
  </div>
</ion-content>
